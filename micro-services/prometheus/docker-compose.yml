version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.53.0             # FIX #7: pinned
    container_name: prometheus
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro     # FIX #5
      - prometheus-data:/prometheus
    networks: [monitoring]
    depends_on: [alertmanager, cadvisor, node_exporter]

  # FIX #5: node_exporter was referenced by prometheus.yml but not defined
  node_exporter:
    image: prom/node-exporter:v1.8.1
    container_name: node_exporter
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks: [monitoring]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1    # FIX #7: pinned
    container_name: cadvisor
    ports: ["8088:8080"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [monitoring]

  alertmanager:
    image: prom/alertmanager:v0.27.0           # FIX #7: pinned
    container_name: alertmanager
    command: ['--config.file=/etc/alertmanager/alertmanager.yml']
    ports: ["9093:9093"]
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets:/etc/alertmanager/secrets:ro          # FIX #1: smtp_password file lives here
    networks: [monitoring]

  grafana:
    image: grafana/grafana:10.4.2              # FIX #7: pinned
    container_name: grafana
    ports: ["3000:3000"]
    environment:
      # FIX #1: all credentials come from .env, nothing hardcoded
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=${GF_SMTP_USER}
      - GF_SMTP_PASSWORD=${GF_SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${GF_SMTP_FROM_ADDRESS}
      - GF_SMTP_FROM_NAME=Grafana Alerts
      - GF_SMTP_STARTTLS_POLICY=MandatoryStartTLS
      - GF_SMTP_SKIP_VERIFY=false              # FIX #4: was true (disabled cert verification)
    volumes: [grafana-storage:/var/lib/grafana]
    networks: [monitoring, app]
    depends_on: [prometheus]

volumes:
  grafana-storage:
  prometheus-data:

networks:
  monitoring:
    driver: bridge
  app:
    external: true
    name: micro-services_app-network
